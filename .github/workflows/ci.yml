name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build
        run: lake build
      - name: Smoke test — help
        run: ./.lake/build/bin/lean-lib --help
      - name: Smoke test — list (no shared libs installed yet)
        run: ./.lake/build/bin/lean-lib list
